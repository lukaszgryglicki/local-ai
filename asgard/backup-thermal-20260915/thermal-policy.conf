# /usr/local/etc/thermal-policy.conf — asgard (Dell Precision 7750, Xeon W-10885M, FreeBSD)
# Read by /usr/local/sbin/thermal-policy and /usr/local/sbin/thermal-watchdog.
# Applied at boot by rc.d/thermal_policy and re-applied every 10 min by the watchdog.
# After editing:  service thermal_policy start ; service thermal_watchdog restart
#
# 2026-09-11 FINAL: all temperature thresholds are +5 C over the computed
# values (owner's decision), incl. the step-back-up ("LO") points; WD_CORE_CRIT
# capped at Tjmax-2 = 98 C (100 C is the DTS ceiling); NVMe TMT2 77 <= MXTMT 79.
#
# Design: FreeBSD has no Intel DPTF (INT3400 / PCI 8086:1903 "Processor Thermal
# Subsystem") support and Dell exposes no ACPI passive/active trip points, so
# without this the CPU runs Dell's PL2=135 W turbo until the EC hard-powers off.

# ---- CPU -------------------------------------------------------------------
CX_LOWEST=Cmax        # deepest idle C-state (C8 here); NEVER leave at C1
EPP=100               # Speed Shift Energy/Performance Preference 0..100 (100 = most efficient)
TURBO_DISABLE=no      # 2026-09-11: Turbo allowed (UEFI Turbo re-enabled); yes = MSR_IA32_MISC_ENABLE bit 38 -> hard 2.4 GHz cap
TCC_OFFSET=10         # PROCHOT/thermal throttle at Tjmax-10 = 90 C instead of 100 C (0..63, 0=off)
MAX_RATIO=53          # HWP max performance ratio x100 MHz when cool; 53 = 5.3 GHz (HWP caps highest). Lower = colder, slower
BASE_RATIO=24         # non-turbo ceiling (2.4 GHz): the turbo band BASE..MAX follows core temp (MAX at <=WD_CORE_LO, BASE at >=WD_CORE_HI), only while PCH<WD_PCH_LO and NVMe<WD_NVME_LO; any HOT drops to BASE at once
MIN_RATIO=12          # floor the watchdog may step down to when hot (1.2 GHz)

# RAPL power limits (watts). Written to MSR 0x610 and the MCHBAR MMIO mirror.
# NOTE: this Dell BIOS/PCU ignores them (measured), kept as belt-and-braces.
RAPL_ENABLE=yes
RAPL_PL1_W=35
RAPL_PL2_W=45

# ---- GPU (NVIDIA Quadro RTX 5000 Mobile) ---------------------------------------
# x11/nvidia-driver is installed and loaded at boot (kld_list nvidia-modeset) for
# Vulkan compute; the driver owns the GPU power state -> D3hot forcing is OFF.
# (Set to yes only if the nvidia kmods are removed from kld_list again.)
# Without persistence mode the RM de-initialises the GPU whenever no client holds
# /dev/nvidia0, so every nvidia-smi query wakes it (~2 s at P0, 18-25 W shown) —
# the watchdog therefore only queries it while a client is attached.
# NEVER run `nvidia-smi -pm 1` (legacy persistence mode) on FreeBSD: on 595.99.02
# it detached the GPU from NVML/Vulkan ("No devices were found") until
# `kldunload nvidia-modeset; kldload nvidia-modeset` (observed 2026-09-11).
GPU_D3HOT=no
GPU_PCI=pci0:1:0:0

# ---- NVMe (4x KINGSTON SKC3000, zroot 4-way mirror) ---------------------------
NVME_HCTM=yes         # Host Controlled Thermal Management: drive self-throttles earlier
NVME_TMT1_C=70        # light throttling above this (firmware default 76 C, allowed 40..79)
NVME_TMT2_C=77        # heavy throttling above this (firmware default 79 C = MXTMT, the drive's max)
NVME_APST=yes         # Autonomous Power State Transition: idle drives drop to PS3 (0.06 W)
NVME_APST_IDLE_MS=2000
NVME_APST_PS=3

# ---- Watchdog ------------------------------------------------------------------
WD_INTERVAL=5         # seconds between CPU/PCH samples
WD_NVME_EVERY=6       # sample NVMe every N ticks (30 s; SMART reads keep drives awake)
WD_LOG_EVERY=12       # write a log line every N ticks (60 s)
WD_REAPPLY_EVERY=120  # re-run 'thermal-policy apply' every N ticks (10 min)
WD_CORE_HI=85         # step frequency cap down when max core >= this
WD_CORE_LO=70         # ... and back up when max core <= this for WD_UP_AFTER ticks
WD_UP_AFTER=12
WD_STEP=2             # ratio step (200 MHz) below BASE_RATIO
WD_TURBO_STEP=2       # ratio step per tick going up inside the turbo band (200 MHz / 5 s: 2.4 -> 5.3 GHz in ~75 s)
WD_PCH_HI=100         # step CPU down above this (owner 2026-09-13 10:40: 95 -> 100; pmtemp 77 C is only the PCH power-management threshold, its hw link throttle starts at 108/111/114 C)
WD_PCH_LO=90          # ... back up only while PCH < this (owner 2026-09-13: 85 -> 90)
WD_NVME_HI=75
WD_NVME_LO=70         # ... back up only while hottest NVMe < this
WD_CORE_CRIT=98       # emergency power-off when max core >= this for WD_CORE_CRIT_N ticks (Tjmax-2; 100 C = sensor ceiling)
WD_CORE_CRIT_N=3
WD_NVME_CRIT=87       # (drive WCTEMP 84 C, CCTEMP 89 C = max)
WD_NVME_CRIT_N=2
WD_PCH_CRIT=115       # (PCH CTT is 120 C)
WD_ACTION="suspend"          # owner decision 2026-09-12 06:2x: S3 first, power-off only if still critical after WD_SUSPEND_GRACE s (was "/sbin/shutdown -p now")
WD_LOG=/var/log/thermal.log
# Emergency action (2026-09-12, default now "suspend"): S3 instead of powering off. All heat sources stop within
# seconds and the session survives; you resume with the power button. If the box is still running with a critical
# sensor WD_SUSPEND_GRACE s of run time after the request (S3 refused/hung, or resumed straight back into the heat)
# it powers off anyway.
# llama-server and S3 (live test 2026-09-12 07:26): a server with GPU work in flight survives the suspend as a
# process, but its Vulkan fence never signals afterwards (TERM-immune, VRAM held). Owner rules 2026-09-12 08:2x:
# ONLY this watchdog's suspend action handles it - WD_SUSPEND_PRE stops the server right before the S3 request
# (TERM, KILL after 3 s; hard limit 15 s), WD_SUSPEND_POST starts it again after the resume the same way it was
# started, only if it was running. A power-off action stops nothing. A normal zzz / poweroff by the owner does
# nothing with llama (the owner stops/starts it). Everything llama-side lives in /data/local-ai (asgard/ops.md);
# log: ~lgryglicki/local-ai-runs/unstick/unstick.log + syslog tag unstick + this log.
WD_SUSPEND_PRE="/data/local-ai/asgard/unstick.sh pre-suspend"
WD_SUSPEND_POST="/data/local-ai/asgard/unstick.sh post-resume"
#WD_ACTION="/sbin/shutdown -p now"   # the previous default
#WD_SUSPEND_GRACE=20
